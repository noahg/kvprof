name: Release

# A tag vX.Y.Z publishes to PyPI and creates the GitHub release. A tag with "rc" in it (v0.2.0rc1) is a rehearsal:
# TestPyPI, a draft prerelease, no Homebrew update, and an unsigned app is allowed.
on:
  push:
    tags: ["v*"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag is the package version
        run: test "v$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/kvprof/__init__.py)" = "$GITHUB_REF_NAME"
      - name: Test and build
        run: |
          python -m pip install -e '.[dev]' build
          pytest -q
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/*

  runtime-linux:
    needs: python
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: dist
      - name: Runtime
        run: |
          packaging/build-runtime.sh linux ${{ matrix.arch }}
          packaging/smoke.sh build/runtime/kvprof-*-linux-${{ matrix.arch }}/bin/kvprof
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-linux-${{ matrix.arch }}
          path: dist/kvprof-*-linux-${{ matrix.arch }}.tar.gz

  macos:
    needs: python
    runs-on: macos-latest
    env:
      SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: dist
      - name: A real release is signed
        if: ${{ !contains(github.ref_name, 'rc') }}
        run: |
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "MACOS_SIGN_IDENTITY is not set; refusing to release an unsigned app"
            exit 1
          fi
      - name: Signing certificate and notarization key
        if: ${{ env.SIGN_IDENTITY != '' }}
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain"
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Apps and disk images
        run: |
          for arch in arm64 x86_64; do
            macos/build-app.sh $arch
            macos/sign-and-notarize.sh $arch
          done
          packaging/smoke.sh build/app/arm64/kvprof.app/Contents/Resources/runtime/bin/kvprof
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/kvprof-*-macos-*.dmg
            dist/kvprof-*-macos-*.tar.gz

  pypi:
    needs: [python, runtime-linux, macos]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing: no token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: dist
      - if: ${{ contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 (v1.14.2)
        with:
          repository-url: https://test.pypi.org/legacy/
      - if: ${{ !contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 (v1.14.2)

  github-release:
    needs: [python, runtime-linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha256_arm64: ${{ steps.sums.outputs.sha256_arm64 }}
      sha256_x86_64: ${{ steps.sums.outputs.sha256_x86_64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        id: sums
        working-directory: assets
        run: |
          cp ../packaging/install.sh .
          sha256sum kvprof-*.tar.gz kvprof-*.dmg kvprof-*.whl > SHA256SUMS
          cat SHA256SUMS
          echo "sha256_arm64=$(sha256sum kvprof-*-macos-arm64.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256_x86_64=$(sha256sum kvprof-*-macos-x86_64.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Release notes
        run: |
          v=${GITHUB_REF_NAME#v}
          {
            cat <<EOF
          ## Which download?

          | You have | Take |
          |---|---|
          | Mac with Apple Silicon (M1 or later) | \`kvprof-$v-macos-arm64.dmg\` |
          | Mac with an Intel CPU | \`kvprof-$v-macos-x86_64.dmg\` |
          | Command line, macOS or Linux, no Python needed | \`curl -LsSf https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh \| sh\` (picks the right build) |
          | Python 3.11+ | \`uvx kvprof start\`, \`uv tool install kvprof\` or \`pipx install kvprof\` |

          Each disk image is built for one architecture; on an Apple Silicon Mac the Intel one runs under Rosetta and macOS warns about it. \`SHA256SUMS\` has the digests of every file.

          ## Changes

          EOF
            # this version's CHANGELOG section (empty for a tag the changelog does not know yet)
            awk -v v="$v" '$0 ~ "^## " v "( |$)" {f=1; next} /^## /{f=0} f' CHANGELOG.md
          } > notes.md
          cat notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *rc*) flags="--draft --prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags --title "kvprof ${GITHUB_REF_NAME#v}" --notes-file notes.md assets/*

  homebrew:
    needs: github-release
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Update the cask in noahg/homebrew-kvprof
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/noahg/homebrew-kvprof.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${GITHUB_REF_NAME#v}/" \
              -e "s/@SHA256_ARM64@/${{ needs.github-release.outputs.sha256_arm64 }}/" \
              -e "s/@SHA256_X86_64@/${{ needs.github-release.outputs.sha256_x86_64 }}/" \
              packaging/homebrew/kvprof.rb.in > tap/Casks/kvprof.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kvprof.rb
          git commit -m "kvprof ${GITHUB_REF_NAME#v}"
          git push
