name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]' build
      - name: Test
        run: pytest -q
      - name: Build
        run: python -m build
      - name: Entry point
        run: python -m kvprof --help

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Wheel
        run: python -m pip install build && python -m build --wheel
      - name: Scripts parse
        run: for f in packaging/*.sh macos/*.sh; do sh -n "$f"; done
      - name: App (ad-hoc signed)
        run: macos/build-app.sh
      - name: The bundled kvprof starts and answers
        run: packaging/smoke.sh "build/app/$(uname -m)/kvprof.app/Contents/Resources/runtime/bin/kvprof"
